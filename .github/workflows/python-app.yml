name: Python application (PyQt6)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # Qt sans écran : pas besoin de serveur X pour les tests
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Dépendances système pour Qt + Qt Multimedia
      - name: Install system dependencies for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libglib2.0-0 \
            libpulse0 libpulse-mainloop-glib0 \
            libxcb-xinerama0 libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libnss3 libasound2t64 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-qt
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: |
          pytest

      # Packaging optionnel (uniquement sur la branche main)
      - name: Package with PyInstaller
        if: github.ref == 'refs/heads/main'
        run: |
          pip install pyinstaller
          pyinstaller --onefile --windowed --name "SolarSound" main.py
          mkdir -p artifacts
          mv dist/SolarSound artifacts/

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: SolarSound-executable
          path: artifacts/
