name: Python application (PyQt6)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest  # Tu peux aussi ajouter windows-latest/macos-latest si besoin

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-qt pyqt6
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest (incluant pytest-qt)
        run: |
          pytest

      # --- Étape optionnelle pour packager l'application ---
      - name: Package with PyInstaller
        if: github.ref == 'refs/heads/main'  # Seule la branche main déclenche le packaging
        run: |
          pip install pyinstaller
          pyinstaller --onefile --windowed --name "SolarSound" main.py  # Remplace main.py par ton fichier principal
          mkdir -p artifacts
          mv dist/SolarSound artifacts/

      - name: Upload artifact (exécutable)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v3
        with:
          name: SolarSound-executable
          path: artifacts/
