name: Python application (PyQt6)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Installation des dépendances système pour Qt (nécessaire pour PyQt6)
      - name: Install system dependencies for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-xinerama0 libxkbcommon-x11-0
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-qt
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      # Exécuter pytest
      - name: Test with pytest
        run: |
          pytest
      # Packaging optionnel (uniquement sur la branche main)
      - name: Package with PyInstaller
        if: github.ref == 'refs/heads/main'
        run: |
          pip install pyinstaller
          pyinstaller --onefile --windowed --name "SolarSound" main.py
          mkdir -p artifacts
          mv dist/SolarSound artifacts/
      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: SolarSound-executable
          path: artifacts/
